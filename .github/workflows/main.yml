# ============================================================
# ENVIRONMENT
# ============================================================

SPREADSHEET_URL = os.environ.get("GOOGLE_SHEET_URL")
OPENAI_API_KEY = os.environ.get("OPENAI_API_KEY")

OPENAI_API_URL = "https://api.openai.com/v1/responses"

MODEL = "gpt-5.6-sol"


# ============================================================
# AI COST CONTROL
#
# 실제 Retry / Resume / 월간 누적 제어는 4창에서 담당한다.
# 여기서는 1회 AI 호출 자체의 안전장치만 유지한다.
# ============================================================

RUN_LIMIT_USD = 5.00
SOURCE_LIMIT_USD = 1.00

INPUT_PRICE_PER_1M = 4.00
OUTPUT_PRICE_PER_1M = 20.00

COST_SAFETY_FACTOR = 1.20

MAX_OUTPUT_TOKENS = 12000


# ============================================================
# ACCOUNT SYSTEM
# ============================================================

ACCOUNTS = [
    ("Angel 10", "ANGEL"),
    ("Angel 20", "ANGEL"),
    ("Angel 30", "ANGEL"),
    ("Angel 40", "ANGEL"),
    ("Angel 50", "ANGEL"),
    ("Angel 60", "ANGEL"),

    ("Devil 10", "DEVIL"),
    ("Devil 20", "DEVIL"),
    ("Devil 30", "DEVIL"),
    ("Devil 40", "DEVIL"),
    ("Devil 50", "DEVIL"),
    ("Devil 60", "DEVIL"),
]


EXPECTED_ACCOUNT_NAMES = {
    account[0]
    for account in ACCOUNTS
}


EXPECTED_ACCOUNT_TYPES = {
    account[0]: account[1]
    for account in ACCOUNTS
}


# ============================================================
# BASIC UTILITIES
# ============================================================

def create_source_id():
    return (
        datetime.now(timezone.utc).strftime("%Y%m%d")
        + "-"
        + uuid.uuid4().hex[:10]
    )


def create_run_id():
    return (
        datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
        + "-"
        + uuid.uuid4().hex[:8]
    )


def count_tokens_estimate(text):
    if not text:
        return 0

    return max(
        1,
        len(text) // 4
    )


def estimate_cost(
    input_tokens,
    output_tokens
):
    input_cost = (
        input_tokens / 1_000_000
    ) * INPUT_PRICE_PER_1M

    output_cost = (
        output_tokens / 1_000_000
    ) * OUTPUT_PRICE_PER_1M

    return (
        input_cost + output_cost
    ) * COST_SAFETY_FACTOR


# ============================================================
# MASTER PROMPT
# ============================================================

def load_master_prompt():

    prompt_path = (
        Path(__file__).parent
        / "MASTER_PROMPT.md"
    )

    if not prompt_path.exists():
        raise FileNotFoundError(
            "MASTER_PROMPT.md 파일을 찾을 수 없습니다."
        )

    return prompt_path.read_text(
        encoding="utf-8"
    )


# ============================================================
# GOOGLE SHEETS - SOURCE
# ============================================================

def get_google_sheet_data():

    if not SPREADSHEET_URL:
        raise RuntimeError(
            "GOOGLE_SHEET_URL이 설정되어 있지 않습니다."
        )

    request = urllib.request.Request(
        SPREADSHEET_URL,
        method="GET"
    )

    try:

        with urllib.request.urlopen(
            request,
            timeout=60
        ) as response:

            raw = response.read().decode(
                "utf-8"
            )

        result = json.loads(raw)

        if not isinstance(result, dict):
            raise RuntimeError(
                "Google Sheets 응답 형식이 올바르지 않습니다."
            )

        return result

    except urllib.error.HTTPError as error:

        error_body = error.read().decode(
            "utf-8",
            errors="replace"
        )

        raise RuntimeError(
            "Google Sheets 읽기 오류: "
            + error_body
        )

    except urllib.error.URLError as error:

        raise RuntimeError(
            "Google Sheets 연결 오류: "
            + str(error)
        )


# ============================================================
# GOOGLE SHEETS - SAVE
# ============================================================

def save_rows_to_google_sheet(rows):

    if not SPREADSHEET_URL:
        raise RuntimeError(
            "GOOGLE_SHEET_URL이 설정되어 있지 않습니다."
        )

    payload = {
        "action": "save_rows",
        "rows": rows
    }

    data = json.dumps(
        payload,
        ensure_ascii=False
    ).encode("utf-8")

    request = urllib.request.Request(
        SPREADSHEET_URL,
        data=data,
        headers={
            "Content-Type": "application/json"
        },
        method="POST"
    )

    try:

        with urllib.request.urlopen(
            request,
            timeout=60
        ) as response:

            raw = response.read().decode(
                "utf-8"
            )

        result = json.loads(raw)

        if not result.get("success"):

            raise RuntimeError(
                "Google Sheets 저장 실패: "
                + str(result)
            )

        return result

    except urllib.error.HTTPError as error:

        error_body = error.read().decode(
            "utf-8",
            errors="replace"
        )

        raise RuntimeError(
            "Google Sheets 저장 오류: "
            + error_body
        )

    except urllib.error.URLError as error:

        raise RuntimeError(
            "Google Sheets 연결 오류: "
            + str(error)
        )


# ============================================================
# ACCOUNT INSTRUCTION
# ============================================================

def build_account_instruction():

    lines = []

    for index, (
        account_name,
        account_type
    ) in enumerate(
        ACCOUNTS,
        start=1
    ):

        lines.append(
            f"{index}. "
            f"{account_name} "
            f"({account_type})"
        )

    return "\n".join(lines)


