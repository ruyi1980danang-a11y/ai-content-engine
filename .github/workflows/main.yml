# ============================================================
# OPENAI
# ============================================================

def ask_openai(
    master_prompt,
    material,
    original_data
):

    if not OPENAI_API_KEY:

        raise RuntimeError(
            "OPENAI_API_KEY가 설정되어 있지 않습니다."
        )

    input_text = build_ai_input(
        material,
        original_data
    )

    estimated_max_cost = (
        check_source_cost(
            input_text,
            master_prompt
        )
    )

    request_data = {

        "model": MODEL,

        "instructions": master_prompt,

        "input": input_text,

        "max_output_tokens":
            MAX_OUTPUT_TOKENS,

        "text": {
            "format": build_schema()
        }

    }

    request = urllib.request.Request(

        OPENAI_API_URL,

        data=json.dumps(
            request_data,
            ensure_ascii=False
        ).encode("utf-8"),

        headers={
            "Authorization":
                f"Bearer {OPENAI_API_KEY}",

            "Content-Type":
                "application/json"
        },

        method="POST"
    )

    try:

        with urllib.request.urlopen(
            request,
            timeout=300
        ) as response:

            raw = response.read().decode(
                "utf-8"
            )

        result = json.loads(raw)

    except urllib.error.HTTPError as error:

        error_body = error.read().decode(
            "utf-8",
            errors="replace"
        )

        if any(
            keyword in error_body
            for keyword in [
                "spend_limit",
                "insufficient_quota",
                "usage_limit"
            ]
        ):

            raise RuntimeError(
                "COST_LIMIT_STOP: "
                + error_body
            )

        raise RuntimeError(
            "OpenAI API 오류: "
            + error_body
        )

    except urllib.error.URLError as error:

        raise RuntimeError(
            "OpenAI 연결 오류: "
            + str(error)
        )

    output_text = result.get(
        "output_text",
        ""
    )

    if not output_text:

        raise RuntimeError(
            "OpenAI 응답에 output_text가 없습니다."
        )

    try:

        structured = json.loads(
            output_text
        )

    except json.JSONDecodeError as error:

        raise RuntimeError(
            "OpenAI 구조화 결과 "
            "JSON 파싱 실패: "
            + str(error)
        )

    usage = result.get(
        "usage",
        {}
    )

    input_tokens = usage.get(
        "input_tokens",
        count_tokens_estimate(
            master_prompt
        )
        +
        count_tokens_estimate(
            input_text
        )
    )

    output_tokens = usage.get(
        "output_tokens",
        count_tokens_estimate(
            output_text
        )
    )

    actual_cost = estimate_cost(
        input_tokens,
        output_tokens
    )

    print(
        f"실제 추정 AI 비용: "
        f"${actual_cost:.6f}"
    )

    if actual_cost > RUN_LIMIT_USD:

        raise RuntimeError(
            "COST_LIMIT_STOP: "
            f"실제 실행 비용 "
            f"${actual_cost:.6f} "
            f"> ${RUN_LIMIT_USD:.2f}"
        )

    if actual_cost > SOURCE_LIMIT_USD:

        raise RuntimeError(
            "COST_LIMIT_STOP: "
            f"실제 소재 비용 "
            f"${actual_cost:.6f} "
            f"> ${SOURCE_LIMIT_USD:.2f}"
        )

    return {

        "accounts":
            structured.get(
                "accounts",
                []
            ),

        "input_tokens":
            input_tokens,

        "output_tokens":
            output_tokens,

        "estimated_cost_usd":
            actual_cost,

        "estimated_max_cost_usd":
            estimated_max_cost

    }


# ============================================================
# ACCOUNT VALIDATION
# ============================================================

def validate_accounts(accounts):

    if not isinstance(
        accounts,
        list
    ):

        raise RuntimeError(
            "AI 결과의 accounts가 "
            "배열이 아닙니다."
        )

    if len(accounts) != 12:

        raise RuntimeError(
            "AI가 12개 계정을 "
            f"반환하지 않았습니다. "
            f"현재 {len(accounts)}개"
        )

    actual_names = {
        account.get("account")
        for account in accounts
    }

    if actual_names != EXPECTED_ACCOUNT_NAMES:

        missing = (
            EXPECTED_ACCOUNT_NAMES
            - actual_names
        )

        extra = (
            actual_names
            - EXPECTED_ACCOUNT_NAMES
        )

        raise RuntimeError(
            "12개 계정 이름이 정확하지 않습니다. "
            f"누락={missing}, "
            f"추가={extra}"
        )

    for account in accounts:

        account_name = account.get(
            "account"
        )

        account_type = account.get(
            "account_type"
        )

        expected_type = (
            EXPECTED_ACCOUNT_TYPES[
                account_name
            ]
        )

        if account_type != expected_type:

            raise RuntimeError(
                f"{account_name} "
                "계정 유형 오류: "
                f"{account_type}"
            )

        title = account.get(
            "title",
            ""
        ).strip()

        story = account.get(
            "story",
            ""
        ).strip()

        if not title:

            raise RuntimeError(
                f"{account_name} "
                "제목이 없습니다."
            )

        if not story:

            raise RuntimeError(
                f"{account_name} "
                "글이 없습니다."
            )

        character_count = account.get(
            "character_count"
        )

        if not isinstance(
            character_count,
            int
        ):

            raise RuntimeError(
                f"{account_name} "
                "character_count 오류"
            )

        actual_character_count = len(
            story
        )

        if character_count != actual_character_count:

            raise RuntimeError(
                f"{account_name} "
                "character_count 불일치: "
                f"AI={character_count}, "
                f"실제={actual_character_count}"
            )

        if actual_character_count > 3000:

            raise RuntimeError(
                f"{account_name} "
                "스토리가 3,000자를 초과했습니다."
            )

        quality = account.get(
            "quality_result"
        )

        if quality not in [
            "PASS",
            "REWRITE",
            "DISCARD",
            "HUMAN ESCALATION"
        ]:

            raise RuntimeError(
                f"{account_name} "
                "품질 결과가 올바르지 않습니다: "
                f"{quality}"
            )

        video_decision = account.get(
            "video_decision"
        )

        if video_decision not in [
            "CREATE",
            "SKIP"
        ]:

            raise RuntimeError(
                f"{account_name} "
                "영상 결정이 올바르지 않습니다: "
                f"{video_decision}"
            )


