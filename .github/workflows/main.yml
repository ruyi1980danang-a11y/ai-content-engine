name: AI Story Engine

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI Story Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEET_URL: "https://script.google.com/macros/s/AKfycbzG1LsC2UpRQt3WGpk-cwJ7uBVzsQ7zik1OURCQHAREJPn2YbrvYOJhi-h_USlU6ZYw4g/exec"
        run: python main.py
