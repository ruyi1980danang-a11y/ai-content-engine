# ============================================================
# COST PRE-CHECK
# ============================================================

def check_source_cost(
    input_text,
    master_prompt
):

    estimated_input_tokens = (
        count_tokens_estimate(
            master_prompt
        )
        +
        count_tokens_estimate(
            input_text
        )
    )

    estimated_output_tokens = (
        MAX_OUTPUT_TOKENS
    )

    estimated_cost = estimate_cost(
        estimated_input_tokens,
        estimated_output_tokens
    )

    print(
        f"예상 최대 AI 비용: "
        f"${estimated_cost:.4f}"
    )

    if estimated_cost > RUN_LIMIT_USD:

        raise RuntimeError(
            "COST_LIMIT_STOP: "
            f"예상 실행 비용 "
            f"${estimated_cost:.4f} "
            f"> 실행 한도 "
            f"${RUN_LIMIT_USD:.2f}"
        )

    if estimated_cost > SOURCE_LIMIT_USD:

        raise RuntimeError(
            "COST_LIMIT_STOP: "
            f"예상 소재 비용 "
            f"${estimated_cost:.4f} "
            f"> 소재 한도 "
            f"${SOURCE_LIMIT_USD:.2f}"
        )

    return estimated_cost


