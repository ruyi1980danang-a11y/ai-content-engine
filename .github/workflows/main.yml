# ============================================================
# MAIN
# ============================================================

def main():

    print("=" * 60)

    print(
        "AI STORY CONTENT ENGINE"
    )

    print(
        "1창 AI CORE 시작"
    )

    print("=" * 60)

    print(
        f"모델: {MODEL}"
    )

    print(
        f"실행 비용 상한: "
        f"${RUN_LIMIT_USD:.2f}"
    )

    print(
        f"소재 비용 상한: "
        f"${SOURCE_LIMIT_USD:.2f}"
    )


    # --------------------------------------------------------
    # MASTER PROMPT
    # --------------------------------------------------------

    master_prompt = (
        load_master_prompt()
    )

    print(
        "MASTER_PROMPT.md 불러오기 성공"
    )


    # --------------------------------------------------------
    # SOURCE
    # --------------------------------------------------------

    source_data = (
        get_google_sheet_data()
    )

    if not source_data.get(
        "success"
    ):

        print(
            "처리할 소재가 없습니다."
        )

        return


    material = source_data.get(
        "소재",
        ""
    )

    original_data = source_data.get(
        "원자료",
        ""
    )

    row_number = source_data.get(
        "row"
    )


    if not material:

        raise RuntimeError(
            "소재가 없습니다."
        )

    if not original_data:

        raise RuntimeError(
            "원자료가 없습니다."
        )


    print(
        f"처리 대상 행: "
        f"{row_number}"
    )

    print(
        f"소재: {material}"
    )


    # --------------------------------------------------------
    # AI CORE
    # --------------------------------------------------------

    print(
        "AI CORE 12계정 생성 시작"
    )

    result = ask_openai(
        master_prompt=master_prompt,
        material=material,
        original_data=original_data
    )


    accounts = result.get(
        "accounts",
        []
    )


    # --------------------------------------------------------
    # AI OUTPUT VALIDATION
    # --------------------------------------------------------

    validate_accounts(
        accounts
    )

    print(
        "12개 계정 구조 검증 완료"
    )


    # --------------------------------------------------------
    # IDS
    # --------------------------------------------------------

    source_id = (
        create_source_id()
    )

    run_id = (
        create_run_id()
    )


    # --------------------------------------------------------
    # SHEET ROWS
    # --------------------------------------------------------

    rows = []

    for account in accounts:

        row = account_to_sheet_row(
            account=account,
            material=material,
            original_data=original_data,
            source_id=source_id,
            run_id=run_id,
            source_cost=result.get(
                "estimated_cost_usd",
                0
            )
        )

        rows.append(row)


    if len(rows) != 12:

        raise RuntimeError(
            "저장할 행이 정확히 "
            "12개가 아닙니다."
        )


    # --------------------------------------------------------
    # GOOGLE SHEETS
    # --------------------------------------------------------

    print(
        "Google Sheets 저장 시작"
    )

    save_result = (
        save_rows_to_google_sheet(
            rows
        )
    )


    print(
        "Google Sheets 저장 완료"
    )

    print(
        f"저장 결과: {save_result}"
    )


    # --------------------------------------------------------
    # RESULT
    # --------------------------------------------------------

    print("=" * 60)

    print(
        "1창 AI CORE 작업 완료"
    )

    print(
        f"소재ID: {source_id}"
    )

    print(
        f"실행ID: {run_id}"
    )

    print(
        "12개 계정 생성 완료"
    )

    print(
        "상태: 사람 검토 대기"
    )

    print("=" * 60)


# ============================================================
# ENTRY POINT
# ============================================================

if __name__ == "__main__":
    main()
